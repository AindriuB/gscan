name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --offline --all-targets -- -D warnings
      - run: cargo test --offline
      - name: Validate JSON with Python
        run: |
          cargo run --offline -- --json > scan.json
          python -c 'import json; d=json.load(open("scan.json")); assert d["schema_version"] == 1; assert isinstance(d["repositories"], list); assert isinstance(d["errors"], list)'
