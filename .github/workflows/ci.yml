name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --offline --all-targets -- -D warnings
      - run: cargo test --offline
      - name: Validate JSON with Python
        run: |
          cargo build --offline
          python tests/validate_json.py target/debug/gscan${{ runner.os == 'Windows' && '.exe' || '' }}
